<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>contact</title>
</head>
<body>
    <header class="header">
        <div class="container header-container">
            <a href="index.html" class="header-logo">Newspaper</a>
            <ul class="header-list">
                <li class="header-item">
                    <a href="index.html" class="header-link">Головна сторінка</a>
                </li>
                <li class="header-item">
                    <a href="contact.html" class="header-link">Контакти</a>
                </li>
            </ul>
        </div>
    </header>
    <main class="main">
        <div class="container contacts-container">
            <div class="contacts-wrap">
                <ul class="contacts-list">
                    <li class="contact-item">
                        <p class="contact-text">Ви можете зателефонувати нам за номером:</p>
                        <a href="tel:+380730000000" class="contact-link">+380730000000</a>
                    </li>
                    <li class="contact-item">
                        <p class="contact-text">Якщо у вас є цікаві новини:</p>
                        <a href="newspaper@gmail.com" class="contact-link">newspaper@gmail.com</a>
                    </li>
                </ul>
                <div class="contact-address">
                    <p class="contact-text">Завітайте до нас в офіс за адресою м.Київ, вул. Хрещатик</p>
                    <img src="map.png" alt="address" class="contact-img">
                </div>
            </div>
        </div>
    </main>
    <footer class="footer">
        <div class="footer-container container">
            <a href="index.html">Newspaper</a>
            <ul class="footer-list">
                <li class="footer-item">
                    <a href="tel:+380730000000" class="footer-link">+380730000000</a>
                </li>
                <li class="footer-item">
                    <a href="mailto:newspaper@gmail.com" class="footer-link">newspaper@gmail.com</a>
                </li>
            </ul>
        </div>
    </footer>
</body>
</html>
